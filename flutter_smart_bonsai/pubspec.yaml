name: smart_bonsai
description: "A premium, production-ready IoT cross-platform mobile app for Bonsai Plant Monitoring and Automatic Watering System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  firebase_core: ^2.30.0
  firebase_database: ^10.5.0
  firebase_auth: ^4.19.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
